    const list = DATA.approvals.filter(by[t]);
    return App.head('결재', { actions: '<button class="btn primary" id="new">문서 쓰기</button>' }) + `
      <div class="card">
        ${tabs(Object.keys(by).map(k => ({ key: k, label: k, count: DATA.approvals.filter(by[k]).length })), t)}
        ${table([
          { label: '종류', get: a => a.kind }, { label: '제목', get: a => esc(a.title) }, { label: '기안자', get: a => `${a.by} <span class="sub-text">${a.dept}</span>` },
          { label: '기안일', get: a => a.at }, { label: '첨부', get: a => a.attach ? `<span class="sub-text">${esc(a.attach.file)}</span>` : '<span class="muted">-</span>' },
          { label: '다음 결재', get: a => a.next || '<span class="muted">-</span>' }, { label: '상태', get: a => st(a.status) },
        ], list, { rowAttr: a => `class="link" data-go="approval/${a.id}"` })}
      </div>`;
  },
  /* 첨부 품의서: 문서 모양 미리보기 */
  paper(a) {
    const x = a.attach;
    if (!x.cols && !x.info) return '';
    return `<div class="paper">
      <div class="paper-title">${esc(x.title)}</div>
      <table class="paper-meta"><tbody>
        <tr><th>문서번호</th><td>${a.id}-2026</td><th>기안일</th><td>2026-${a.at.replace('/', '-').padStart(5, '0')}</td></tr>
        <tr><th>기안자</th><td>${esc(a.by)}</td><th>부서</th><td>${esc(a.dept)}</td></tr>
        <tr><th>제목</th><td colspan="3">${esc(a.title)}</td></tr>
        ${(x.info || []).map(i => `<tr><th>${esc(i[0])}</th><td colspan="3">${esc(i[1])}</td></tr>`).join('')}
      </tbody></table>
      ${x.cols && x.cols.length ? `<table class="paper-items"><thead><tr>${x.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${x.rows.map(r => `<tr>${r.map((v, i) => `<td class="${/^[\d,.]+$/.test(v) && i > 0 ? 'num' : ''}">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        ${x.foot ? `<tfoot><tr>${x.foot.map((v, i) => `<td class="${i > 0 && v ? 'num' : ''}">${esc(v)}</td>`).join('')}</tr></tfoot>` : ''}</table>` : ''}
      ${x.note ? `<div class="paper-note">비고: ${esc(x.note)}</div>` : ''}
    </div>`;
  },
  detail(id) {
    const a = DATA.approvals.find(x => x.id === id);
    const mine = a.status === '결재 대기' && a.next === DATA.me.name;
    return App.head(a.title, { crumb: '사내 업무 › <a data-go="approval">결재</a>', back: 'approval', meta: `${a.kind} · ${a.by} · ${a.at}`, actions: mine ? '<button class="btn" id="rej">반려</button><button class="btn primary" id="ok">승인</button>' : '' }) + `
      <div class="card"><div class="card-head">결재선<span class="right">${st(a.status)}</span></div>
        <div class="card-body"><div class="approval-line">${a.line.map(l => `<div><div class="sub-text">${l[1]}</div><div class="who">${l[0]}</div><div class="meta">${l[2] || (a.next === l[0] ? '대기' : '')}</div></div>`).join('')}</div></div></div>
      <div class="card"><div class="card-head">본문</div><div class="card-body"><div class="doc">${esc(a.body)}</div>${a.comment ? `<div class="sub-text" style="margin-top:12px">의견: ${esc(a.comment)}</div>` : ''}</div></div>
      ${a.attach ? `<div class="card"><div class="card-head">첨부 품의서<span class="right"><span class="sub-text">${esc(a.attach.file)}</span><button class="btn sm" id="att-dl">내려받기</button></span></div>
        <div class="card-body paper-wrap">${this.paper(a) || '<div class="empty">미리 볼 수 없는 파일입니다</div>'}</div></div>` : ''}`;
  },
  mount(root, param) {
    if (!param) {
      $$('[data-tab]', root).forEach(b => b.onclick = () => { UI.appr.tab = b.dataset.tab; App.refresh(); });
      $('#new', root).onclick = () => App.modal({
        title: '문서 쓰기', wide: true,
        body: `<div class="form-grid"><label>양식</label>${select(['지출', '발주 품의', '출고 요청', '일반 기안'], '일반 기안', 'id="kind"')}<label>제목</label><input class="input" id="title"><label>결재선</label><span>${DATA.me.name} → 박정민 → 최윤호</span><label style="align-self:start;padding-top:8px">내용</label><textarea class="textarea" rows="8" id="body"></textarea><label>첨부 품의서</label><div class="row-gap"><label class="btn sm" style="display:inline-flex;align-items:center">파일 선택<input type="file" id="att" style="display:none"></label><span class="sub-text" id="att-name">파일 없음</span></div></div>`,
        onMount: (el) => { $('#att', el).onchange = (e) => { const f = e.target.files[0]; $('#att-name', el).textContent = f ? f.name : '파일 없음'; }; },
        actions: [{ label: '임시 저장', onClick: () => App.toast('임시 저장했습니다') }, { label: '결재 올리기', primary: true, onClick: (el) => {
          const title = $('#title', el).value.trim(); if (!title) { App.toast('제목을 입력하세요'); return false; }
          const f = $('#att', el).files[0];
          DATA.approvals.unshift({ id: 'A' + (30 + DATA.approvals.length), kind: $('#kind', el).value, title, by: DATA.me.name, dept: DATA.me.dept, at: md(TODAY), status: '결재 대기', next: '박정민', line: [[DATA.me.name, '기안', md(TODAY)], ['박정민', '검토', ''], ['최윤호', '승인', '']], body: $('#body', el).value,
            attach: f ? { file: f.name, title: $('#kind', el).value } : null });
          UI.appr.tab = '올린 결재'; App.refresh(); App.toast('결재를 올렸습니다');
        } }],
      });
      return;
    }
    const a = DATA.approvals.find(x => x.id === param);
    const act = (ok) => App.modal({
      title: ok ? '승인' : '반려', body: `<textarea class="textarea" id="cm" rows="3" placeholder="의견 (선택)"></textarea>`,
      actions: [{ label: '취소' }, { label: ok ? '승인' : '반려', primary: true, onClick: (el) => {
        const i = a.line.findIndex(l => l[0] === a.next); a.line[i][2] = md(TODAY); a.comment = $('#cm', el).value;
        if (!ok) { a.status = '반려'; a.next = ''; }
        else if (i + 1 < a.line.length) { a.next = a.line[i + 1][0]; }
        else { a.status = '승인'; a.next = ''; }
        App.refresh(); App.toast(ok ? '승인했습니다' : '반려했습니다');
      } }],
    });
    const dl = $('#att-dl', root);
    if (dl) dl.onclick = () => {
      const x = a.attach;
      App.download(x.file.replace(/\.\w+$/, '') + '.csv', [[x.title], ['문서번호', `${a.id}-2026`], ['기안자', a.by], ['제목', a.title], ...(x.info || []), [], ...(x.cols && x.cols.length ? [x.cols, ...x.rows] : []), ...(x.foot ? [x.foot] : []), ...(x.note ? [[], ['비고', x.note]] : [])]);
    };
    const ok = $('#ok', root), rej = $('#rej', root);
    if (ok) ok.onclick = () => act(true);
    if (rej) rej.onclick = () => act(false);
  },
};

    const m = DATA.minutes.find(x => x.id === id);

      <div class="grid-2">
        <div class="card"><div class="card-head">회의록</div><div class="card-body"><div class="doc">${esc(m.body)}</div></div></div>
        <div class="card"><div class="card-head">회의에서 나온 할 일<span class="right sub-text">예시 정리</span></div>
          ${table([
            { label: '', cls: 'chk', get: (t, i) => m.sent ? '' : `<input type="checkbox" data-t="${i}" checked>` },
            { label: '할 일', get: t => esc(t[0]) }, { label: '담당', get: t => t[1] }, { label: '기한', get: t => t[2] },
          ], m.todos)}
          <div class="card-body row-gap" style="border-top:1px solid var(--line)"><span class="grow"></span>${m.sent ? '<span class="st-done">할 일로 보냈습니다</span>' : '<button class="btn primary" id="send">할 일로 보내기</button>'}</div>
        </div>
      </div>`;
  },
  mount(root, param) {
    if (!param) {
      $('#up', root).onclick = () => App.modal({
        title: '회의록 올리기', wide: true,
        body: `<div class="form-grid"><label>제목</label><input class="input" id="title"><label>날짜</label><input class="input" type="date" id="at" value="${ymd(TODAY)}"><label>참석자</label><input class="input" id="who" placeholder="이름을 쉼표로 구분">
          <label>파일</label><label class="btn sm" style="width:max-content;display:inline-flex;align-items:center">파일 선택<input type="file" style="display:none"></label>
          <label style="align-self:start;padding-top:8px">내용</label><textarea class="textarea" rows="8" id="body"></textarea></div>`,
        actions: [{ label: '취소' }, { label: '올리기', primary: true, onClick: (el) => {
          const title = $('#title', el).value.trim(); if (!title) { App.toast('제목을 입력하세요'); return false; }
          const body = $('#body', el).value;
          const todos = body.split('\n').filter(l => /한다|확인|협의|정리/.test(l)).slice(0, 4).map(l => [l.replace(/^\s*[\d.\-·]+\s*/, '').slice(0, 30), DATA.me.name, md(addDays(TODAY, 3))]);

        } }],
      });
      return;
    }
    const m = DATA.minutes.find(x => x.id === param);
    const s = $('#send', root);
    if (s) s.onclick = () => {
      const pick = $$('[data-t]', root).filter(c => c.checked).map(c => m.todos[+c.dataset.t]);

};

App.screens['todo'] = {
  render() {
    const cols = ['할 일', '진행 중', '완료'];
    const people = ['전체', ...new Set(DATA.staff.filter(s => s.on).map(s => s.name))];
    const list = DATA.todos.filter(t => UI.todo.who === '전체' || t.who === UI.todo.who);
    return App.head('할 일', { actions: `${select(people, UI.todo.who, 'id="who"')}<button class="btn primary" id="new">할 일 추가</button>` }) + `
      <div class="board">${cols.map(c => { const ts = list.filter(t => t.col === c); return `<div class="col" data-col="${c}"><div class="col-head">${c}<span>${ts.length}</span></div>
        ${ts.map(t => `<div class="task" draggable="true" data-id="${t.id}"><div class="t">${esc(t.t)}</div><div class="m"><span>${t.who}</span><span class="${t.col !== '완료' && t.due === md(TODAY) ? 'st-need' : ''}">~${t.due}</span></div></div>`).join('')}</div>`; }).join('')}</div>`;
  },
  edit(t) {
    const isNew = !t;
    t = t || { t: '', who: DATA.me.name, due: md(addDays(TODAY, 3)), col: '할 일', desc: '' };
    App.modal({
      title: isNew ? '할 일 추가' : '할 일',
      body: `<div class="form-grid"><label>제목</label><input class="input" id="tt" value="${esc(t.t)}"><label>담당자</label>${select(DATA.staff.filter(s => s.on).map(s => s.name), t.who, 'id="tw"')}<label>기한</label><input class="input" id="td" value="${esc(t.due)}"><label>상태</label>${select(['할 일', '진행 중', '완료'], t.col, 'id="tc"')}<label style="align-self:start;padding-top:8px">내용</label><textarea class="textarea" rows="4" id="tx">${esc(t.desc)}</textarea></div>`,
      left: isNew ? '' : '<button class="btn" id="tdel" style="color:var(--danger)">삭제</button>',
      onMount: (el, close) => { const d = $('#tdel', el); if (d) d.onclick = () => { DATA.todos.splice(DATA.todos.indexOf(t), 1); close(); App.refresh(); }; },
      actions: [{ label: '취소' }, { label: '저장', primary: true, onClick: (el) => {
        const o = { t: $('#tt', el).value.trim(), who: $('#tw', el).value, due: $('#td', el).value, col: $('#tc', el).value, desc: $('#tx', el).value };
        if (!o.t) { App.toast('제목을 입력하세요'); return false; }
        if (isNew) DATA.todos.push({ id: 'T' + (DATA.todos.length + 10), ...o }); else Object.assign(t, o);
        App.refresh();
      } }],
    });
  },
  mount(root) {
    $('#who', root).onchange = (e) => { UI.todo.who = e.target.value; App.refresh(); };
    $('#new', root).onclick = () => this.edit(null);
    $$('.task', root).forEach(el => {
      el.onclick = () => this.edit(DATA.todos.find(t => t.id === el.dataset.id));
      el.ondragstart = (e) => e.dataTransfer.setData('text/plain', el.dataset.id);
    });
    $$('.col', root).forEach(col => {
      col.ondragover = (e) => { e.preventDefault(); col.classList.add('drop'); };
      col.ondragleave = () => col.classList.remove('drop');
      col.ondrop = (e) => { e.preventDefault(); const t = DATA.todos.find(x => x.id === e.dataTransfer.getData('text/plain')); if (t) { t.col = col.dataset.col; App.refresh(); } };
    });
  },
};

function warehousePlot(product){
  const groups=DATA.warehouses.map(w=>({name:w.name,sys:w.sys,n:product?product.stock[w.key]:DATA.products.reduce((v,p)=>v+p.stock[w.key],0)}));
  const total=groups.reduce((s,w)=>s+w.n,0), colors=['#66a08b','#e7925a','#8c9fb6'];let end=0;
  const slices=groups.map((w,i)=>{const start=end;end+=total?w.n/total*100:0;return `${colors[i]} ${start}% ${end}%`});
  return `<section class="warehouse-plot"><header><div><span class="chart-kicker">${product?esc(product.dr)+' · 시연 재고':'시연 상품 '+DATA.products.length+'개'}</span><h2>창고별 재고 분포</h2></div><button data-go="${product?'inv-product':'inv-product/Dr003'}" class="plot-link">${product?'재고 목록':'품목별 보기'} ↗</button></header><div class="warehouse-graphic"><div class="warehouse-ring" aria-hidden="true" style="--slices:${total?'conic-gradient('+slices.join(',')+')':'#d5dbd5'}"><span><b>${groups.length}</b><small>창고</small></span></div><div class="warehouse-keys"><div class="inventory-total"><strong>${fmt(total)}</strong><span>개</span></div>${groups.map((w,i)=>`<div class="warehouse-key"><i style="background:${colors[i]}"></i><span>${esc(w.name)}</span><b>${fmt(w.n)}</b><small>${total?(w.n/total*100).toFixed(1):'0.0'}%</small></div>`).join('')}</div></div></section>`;
}
function selectedFeed(){return feedRows().find(r=>r.p.dr==='Dr003');}
function feedDecision(row){
 const p=row.p;const changed=row.st.qty!==row.rec, actual=UI.feed.confirmed||changed, candidate=actual?row.st.qty:row.rec+p.unit;
 const example=actual?(UI.feed.confirmed?'품의 수량':'입력 수량'):'조정 예시';
 const note=actual?(row.st.reason||'추천량 유지'):'행사 대비 1단위 추가';
 return `<section class="order-decision casefile"><div class="decision-head"><span>12월 사료 발주 검토</span><span>${esc(p.dr)} · 시연 품목</span></div><h2>그레인프리 연어 <small>2kg</small></h2><div class="decision-values"><div><span>추천 수량</span><strong>${row.rec===null?'-':fmt(row.rec)}<small>개</small></strong></div><i aria-hidden="true">→</i><div><span>${example}</span><strong>${candidate===null?'-':fmt(candidate)}<small>개</small></strong></div></div><div class="decision-reason"><i></i>${esc(note)}<span>발주 단위 ${fmt(p.unit)}개</span></div><div class="decision-actions"><button data-go="inv-product/${p.dr}">창고별 재고</button><button data-go="order-feed">발주 계산 보기 →</button></div></section>`;
}
function targetGraphic(row){
  if(!row||row.hold)return '';
  const items=[['가용 재고',row.stock],['월말 예상',row.end],['목표 재고',row.target]];const max=Math.max(...items.map(x=>x[1]),1);
  return `<section class="target-plot"><div class="target-label"><div class="chart-kicker">${esc(row.p.dr)} · 예시 품목</div><h2>발주량 산출 근거</h2><p>입고 예정 ${fmt(row.p.po)}개를 반영한 월말 예상치입니다.</p></div><div class="target-bars">${items.map(([name,num],i)=>`<div><span>${name}</span><i><em style="width:${Math.max(0,num/max)*100}%;--segment:${['#7da797','#457763','#d28349'][i]}"></em></i><b>${fmt(Math.round(num))}개</b></div>`).join('')}</div></section>`;
}
function shipmentVisual(q){
 if(!q?.ship)return '';
 let ship=q.ship;const parts=[['주문','주문 연결',q.no],['송장','운송장',ship.inv||'미등록'],['배송','택배사 기록',ship.state]];
 return `<section class="shipment-summary"><div class="shipment-heading"><span>${svgIcon('truck')}</span><h2>주문·배송 확인</h2><small>시연 기록</small></div><div class="shipment-track">${parts.map(([short,label,value],i)=>`<div><i>${svgIcon(['doc','box','truck'][i])}</i><span><small>${label}</small><b>${esc(value)}</b></span></div>`).join('')}</div></section>`;
}

 document.title=(this.labelOf(this.current.id).label||'운영 현황')+' · 일현 운영실';

/* ─────────────────────────────────────────────────────────────
   일현 운영실 · 정교화 층 (v3, 2026-11-24)
   원안의 화면 함수는 건드리지 않고, 그린 뒤의 화면에 표식과 그림을 얹습니다.
   숫자는 모두 원안의 DATA·Calc·feedRows()에서 그대로 가져옵니다.
   ───────────────────────────────────────────────────────────── */
{
  const DANGER_STATUS = new Set(['위험', '반려', '출고 보류', '과다 청구', '과소 청구', '부족']);
  const CODE_COLS = new Set(['기준코드', '주문번호', '송장번호', '문서번호', 'PlusCL 코드', 'CJ 코드', '코드', '상품코드', '발주번호', '발주서 번호', '바코드']);
  const WH_COLORS = ['var(--w0)', 'var(--w1)', 'var(--w2)'];
  const DAY_SCALE = 90;

  /* ── 옆 메뉴: 업무 묶음 이름 ── */
  const SECTIONS = { '재고 현황': '물류', '주문 관리': '주문 · 정산', '고객 응대': '고객', '사내 업무': '사내', '직원 관리': '관리' };
  const sideBefore = App.renderSide.bind(App);
  App.renderSide = function () {
    sideBefore();
    const side = document.getElementById('side'); if (!side) return;
    side.querySelectorAll(':scope > .group, :scope > .menu-item').forEach(el => {
      const label = el.querySelector('.side-label'); if (!label) return;
      const sec = SECTIONS[label.textContent.trim()];
      if (sec) el.insertAdjacentHTML('beforebegin', `<div class="side-sec">${sec}</div>`);
    });
  };

  /* ── 공통: 상태 표식, 코드 열 ── */
  function decorate(main) {
    main.querySelectorAll('span.st-need, span.st-doing, span.st-done').forEach(s => {
      if (s.closest('.filters')) return;
      s.classList.add('pill');
    });
    main.querySelectorAll('td > span.danger, dd > span.danger').forEach(s => {
      if (DANGER_STATUS.has(s.textContent.trim())) s.classList.add('pill');
    });
    main.querySelectorAll('td > span[class=""]').forEach(s => {
      if (s.textContent.trim()) s.classList.add('pill', 'neutral');
    });
    main.querySelectorAll('.table-wrap table').forEach(t => {
      const heads = Array.from(t.querySelectorAll('thead th')).map(th => th.textContent.trim());
      heads.forEach((h, i) => {
        if (!CODE_COLS.has(h)) return;
        t.querySelectorAll('tbody tr').forEach(tr => {
          const td = tr.cells[i];
          if (td && !td.querySelector('input, select, button') && !td.classList.contains('empty')) td.classList.add('code');
        });
      });
    });
  }
  const colOf = (t, label) => Array.from(t.querySelectorAll('thead th')).findIndex(th => th.textContent.trim() === label);

  /* ── 상품 재고: 창고별 재고와 먼저 볼 품목 ── */
  function invOverview() {
    const ws = DATA.warehouses.map((w, i) => ({ ...w, n: DATA.products.reduce((s, p) => s + p.stock[w.key], 0), c: WH_COLORS[i] }));
    const total = ws.reduce((s, w) => s + w.n, 0);
    const watch = DATA.products.filter(p => Calc.risk(p))
      .map(p => ({ p, days: Calc.days(p), line: p.lt + 7 }))
      .sort((a, b) => (a.days - a.line) - (b.days - b.line)).slice(0, 5);
    const scale = Math.max(...watch.map(x => Math.max(x.days, x.line)), 1) * 1.12;
    return `<section class="v3-panel v3-split">
      <div class="v3-col">
        <header><h2>창고별 재고</h2><span>상품 ${DATA.products.length}개 · ${fmt(total)}개</span></header>
        <div class="stackbar" role="img" aria-label="창고별 재고 비중">${ws.map(w => `<i style="flex:${w.n};background:${w.c}" title="${esc(w.name)} ${fmt(w.n)}개"></i>`).join('')}</div>
        <div class="stack-legend">${ws.map(w => `<div><em style="--c:${w.c}">${esc(w.name)}</em><strong>${fmt(w.n)}</strong><small>${total ? (w.n / total * 100).toFixed(1) : '0.0'}% · ${esc(w.sys)}</small></div>`).join('')}</div>
      </div>
      <div class="v3-col">
        <header><h2>먼저 볼 품목</h2><span>간식·기타 · 발주 여유가 적은 순</span></header>
        <ol class="watch">${watch.map(x => `<li>
          <button data-go="inv-product/${x.p.dr}">${esc(x.p.name)}</button>
          <span class="daybar ${x.days < x.line ? 'is-risk' : ''}"><i style="width:${Math.min(100, x.days / scale * 100)}%"></i><u style="left:${Math.min(100, x.line / scale * 100)}%"></u></span>
          <b>${Math.round(x.days)}일</b></li>`).join('')}</ol>
        <p class="watch-note"><u></u>세로선은 리드타임에 7일을 더한 발주 여유선입니다</p>
      </div>
    </section>`;
  }
  function invRows(main) {
    const t = main.querySelector('.table-wrap table'); if (!t) return;
    const iTotal = colOf(t, '총재고'), iDays = colOf(t, '재고소요일');
    t.querySelectorAll('tbody tr[data-go]').forEach(tr => {
      const p = Calc.prod((tr.dataset.go || '').split('/')[1]); if (!p) return;
      if (iTotal >= 0) tr.cells[iTotal].innerHTML = `<span class="totalcell"><b>${fmt(Calc.total(p))}</b><span class="split">${DATA.warehouses.map(w => `<i style="flex:${p.stock[w.key]}"></i>`).join('')}</span></span>`;
      if (iDays >= 0) {
        const d = Math.round(Calc.days(p)), ruled = !!Calc.risk(p);
        tr.cells[iDays].innerHTML = `<span class="daycell"><span class="daybar ${Calc.risk(p) === '위험' ? 'is-risk' : ''}"><i style="width:${Math.min(100, d / DAY_SCALE * 100)}%"></i>${ruled ? `<u style="left:${Math.min(100, (p.lt + 7) / DAY_SCALE * 100)}%"></u>` : ''}</span><span>${d}일</span></span>`;
      }
    });
  }

  /* ── 사료 발주: 추천 수량이 나오는 과정 ── */
  targetGraphic = function () { return ''; };   // 11/24 시연의 세 줄 막대는 아래 그림으로 바꿉니다
  const focusFeed = () => { const rows = feedRows(); return rows.find(r => r.p.dr === UI.feed.focus && !r.hold) || rows.find(r => r.p.dr === 'Dr003') || rows.find(r => !r.hold); };
  function feedWhy(row) {
    if (!row || row.hold) return '';
    const p = row.p, r = DATA.feedRound;
    const po = p.po || 0, out = row.avg * r.remainDays, ex = p.extraOut || 0;
    const qty = Number(row.st.qty) || 0, changed = qty !== row.rec;
    const steps = [
      { name: '가용재고', sub: '두 창고 합계', from: 0, to: row.stock, text: fmt(row.stock), fill: '#c5d0ca' },
      { name: '입고 예정', sub: '미입고 발주', from: row.stock, to: row.stock + po, text: '+' + fmt(po), fill: '#7fa894' },
      { name: '월말까지 출고', sub: `하루 ${row.avg.toFixed(1)} × ${r.remainDays}일`, from: row.stock + po, to: row.stock + po - out, text: '−' + fmt(Math.round(out)), fill: '#e1e6e2' },
      { name: '별도 출고 예정', sub: '행사·이동 등', from: row.stock + po - out, to: row.end, text: '−' + fmt(ex), fill: '#e1e6e2' },
      { name: '월말 예상 재고', sub: '', from: 0, to: row.end, text: fmt(Math.round(row.end)), fill: '#1f5a50' },
      { name: changed ? '이번 발주 (입력)' : '이번 발주 (추천)', sub: `${fmt(p.unit)}개 단위`, from: row.end, to: row.end + qty, text: '+' + fmt(qty), fill: '#d98a4e' },
    ];
    const W = 920, H = 232, L = 12, R = 908, TOP = 30, BASE = 176, colW = (R - L) / steps.length, barW = 84;
    const max = Math.max(row.stock + po, row.end + qty, row.target, 1) * 1.1;
    const y = v => BASE - Math.max(0, v) / max * (BASE - TOP);
    const cx = i => L + colW * i + colW / 2;
    const bars = steps.map((s, i) => {
      const y1 = y(Math.max(s.from, s.to)), y2 = y(Math.min(s.from, s.to)), h = Math.max(y2 - y1, s.from === s.to ? 0 : 2);
      const link = i < steps.length - 1 && i !== 3 ? `<line x1="${cx(i) + barW / 2}" x2="${cx(i + 1) - barW / 2}" y1="${y(s.to)}" y2="${y(s.to)}" stroke="rgba(21,40,35,.28)" stroke-dasharray="2 3"/>` : '';
      const link4 = i === 3 ? `<line x1="${cx(i) + barW / 2}" x2="${cx(i + 1) - barW / 2}" y1="${y(s.to)}" y2="${y(s.to)}" stroke="rgba(21,40,35,.28)" stroke-dasharray="2 3"/>` : '';
      return `${h ? `<rect x="${cx(i) - barW / 2}" y="${y1}" width="${barW}" height="${h}" rx="3" fill="${s.fill}"/>` : `<line x1="${cx(i) - barW / 2}" x2="${cx(i) + barW / 2}" y1="${y1}" y2="${y1}" stroke="rgba(21,40,35,.35)" stroke-width="1.5"/>`}
        ${link}${link4}
        <text class="v" x="${cx(i)}" y="${y1 - 8}" text-anchor="middle">${s.text}</text>
        <text class="n" x="${cx(i)}" y="${BASE + 20}" text-anchor="middle">${s.name}</text>
        ${s.sub ? `<text class="t" x="${cx(i)}" y="${BASE + 38}" text-anchor="middle">${s.sub}</text>` : ''}`;
    }).join('');
    const ty = y(row.target);
    return `<section class="v3-panel feed-why">
      <header><h2>발주량 산출 과정</h2><span><b>${esc(p.name)}</b> · 표에서 품목을 누르면 바뀝니다</span><span class="asof">기준일 ${esc(r.base)}</span></header>
      <div class="wf-wrap"><svg class="wf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} 발주량 산출 과정">
        <line x1="${L}" x2="${R}" y1="${BASE}" y2="${BASE}" stroke="rgba(21,40,35,.22)"/>
        <line x1="${L}" x2="${R}" y1="${ty}" y2="${ty}" stroke="#15251f" stroke-width="1" stroke-dasharray="5 4"/>
        <text class="t halo" x="${L}" y="${ty - 7}" style="fill:#15251f;font-weight:600">목표 재고 ${fmt(Math.round(row.target))} · ${p.target}일분</text>
        ${bars}
      </svg></div>
      <div class="formula">
        <span>월말 예상 <b>${fmt(Math.round(row.end))}</b> = ${fmt(row.stock)} + ${fmt(po)} − (${row.avg.toFixed(1)} × ${r.remainDays} + ${fmt(ex)})</span>
        <span>목표 <b>${fmt(Math.round(row.target))}</b> = ${row.avg.toFixed(1)} × ${p.target}일</span>
        <span>추천 <b>${fmt(row.rec)}</b> = 부족분 ${fmt(Math.max(0, Math.ceil(row.target - row.end)))} → ${fmt(p.unit)}개 단위로 올림${changed ? ` · 입력 <b>${fmt(qty)}</b>` : ''}</span>
      </div>
    </section>`;
  }
  function feedFocusRows(main, row) {
    const t = main.querySelector('.table-wrap table'); if (!t) return;
    const rows = feedRows();
    Array.from(t.tBodies[0].rows).forEach((tr, i) => {
      const x = rows[i]; if (!x || x.hold) return;
      tr.classList.add('can-focus');
      if (row && x.p.dr === row.p.dr) tr.classList.add('is-focus');
      tr.addEventListener('click', e => {
        if (e.target.closest('input, select, button, a')) return;
        UI.feed.focus = x.p.dr; App.refresh();
      });
    });
  }

  /* ── 주문 내역: 네 단계 흐름 ── */
  const FLOW_NOTE = { '수집됨': '자사 WMS 등록 전', 'WMS 등록': '주문사 송장 등록 전', '송장 등록': '출고 확인 전', '출고완료': '처리 끝' };
  function orderFlow() {
    const total = DATA.orders.length || 1;
    return `<div class="flowbar">${ORDER_FLOW.map((s, i) => {
      const n = DATA.orders.filter(o => o.status === s).length;
      return `<div class="flow-step ${i === 0 && n ? 'is-wait' : ''}"><em><i>${i + 1}</i>${s}</em><strong>${n}<small>건</small></strong><p>${FLOW_NOTE[s] || ''}</p><div class="share"><i style="width:${n / total * 100}%"></i></div></div>`;
    }).join('')}</div>`;
  }

  /* ── 그린 뒤에 얹기 ── */
  const mainBefore = App.renderMain.bind(App);
  App.renderMain = function () {
    mainBefore();
    const main = document.getElementById('main'); if (!main) return;
    const { id, param } = this.current;
    try {
      if (id === 'inv-product' && !param) {
        const stats = main.querySelector('.stats');
        if (stats) stats.insertAdjacentHTML('afterend', invOverview());
        invRows(main);
      }
      if (id === 'order-feed') {
        const row = focusFeed(), head = main.querySelector('.page-head');
        if (head && row) head.insertAdjacentHTML('afterend', feedWhy(row));
        feedFocusRows(main, row);
      }
      if (id === 'orders' && !param) {
        const stats = main.querySelector('.stats');
        if (stats) stats.outerHTML = orderFlow();
      }
      decorate(main);
    } catch (err) { console.error('v3 layer', err); }
  };
}


/* ─────────────────────────────────────────────────────────────
   일현 운영실 · 11/24 회의 반영 층 (v4, 2026-11-25)
   11월 24일 화면 검토와 물류 요구사항 회의에서 나온 것을 얹습니다.
   - 입고: 본사가 예정을 등록하고 3PL이 검수해 확정, 거래명세서와 대조, 결제 요청
   - 유통기한(소비기한)별 재고, 품목별 출고 정지 기준과 임박 알림
   - 쿠팡 입고: 자사몰 몫을 남긴 추천 수량, 잔여 소비기한 50% 규칙, 센터별 등록 정보와 현장 지시서
   - 3PL 정산: 업체별 원본 양식 그대로 대조하고 세 창고를 합쳐 건당 비용을 본다
   - 권한: 화면 묶음별 보기·편집, 브랜드 범위, 3PL 계정
   - 알림 규칙: 자체 메신저 전까지 Slack으로
   숫자와 이름은 모두 예시입니다.
   ───────────────────────────────────────────────────────────── */
{
  const D = (s) => { const [m, d] = s.split('/').map(Number); return new Date(m >= 11 ? 2026 : 2027, m - 1, d); };
  const DAY = 86400000;
  const daysTo = (iso) => Math.round((new Date(iso + 'T00:00:00') - TODAY) / DAY);
  const ST4 = {
    '출고 가능': 'st-done', '1차 알림': 'st-doing', '2차 알림': 'st-need', '출고 정지': 'danger', '쿠팡 불가': 'st-need',
    '예정 등록': 'st-doing', '3PL 검수': 'st-need', '수량 차이': 'danger', '입고 확정': 'st-done', '결제 요청': 'st-done',
  };
  const st4 = (s) => `<span class="pill ${ST4[s] || 'neutral'}">${esc(s)}</span>`;
  const whName = (k) => (DATA.warehouses.find(w => w.key === k) || {}).name || k;

  /* ── 소비기한 규칙 (예시 값 · 물류팀과 확정) ── */
  DATA.expiryRule = {
    '사료': { life: 540, stop: 180, a1m: 6, a2m: 9 },
    '습식캔': { life: 730, stop: 150, a1m: 6, a2m: 9 },
    '간식': { life: 365, stop: 120, a1m: 6, a2m: 9 },
    '냉동': { life: 270, stop: 90, a1m: 4, a2m: 6 },
  };
  DATA.returnRule = 30;
  const ruleOf = (p) => DATA.expiryRule[p.cat] || DATA.expiryRule['간식'];
  const lotState = (p, l) => { const r = ruleOf(p); const mo = l.age / 30.4; return l.remain <= r.stop ? '출고 정지' : mo >= r.a2m ? '2차 알림' : mo >= r.a1m ? '1차 알림' : '출고 가능'; };

  /* ── 로트(소비기한 묶음): 창고별 재고를 2~3묶음으로 나눈 예시 ── */
  const iso = (d) => ymd(d);
  DATA.lots = {};
  DATA.products.forEach((p, i) => {

          { label: '실제 수량', cls: 'num', get: (l, i) => `<input class="input num sm" data-r="${i}" value="${l.plan}">` }], x.lines)}`,
        actions: [{ label: '닫기' }, { label: '3PL 확정 (예시)', primary: true, onClick: (el) => {
          $$('[data-r]', el).forEach(inp => { x.lines[+inp.dataset.r].real = +inp.value || 0; });
          if (diffOf(x)) { x.status = '수량 차이'; App.toast('예정과 다른 수량이 있어 본사 확인으로 넘겼습니다'); }
          else { x.status = '입고 확정'; x.lines.forEach(l => { const pp = Calc.prod(l.dr); if (pp) { pp.stock[x.wh] += l.real; (DATA.lots[l.dr] = DATA.lots[l.dr] || []).push({ exp: l.exp, kind: '정상', tri: 0, naver: 0, fresh: 0, [x.wh]: l.real }); } else { const sv = (DATA.sovs || []).find(v => v.code === l.dr); if (sv) sv.wh += l.real; } }); App.toast('입고 확정, 재고에 반영했습니다'); }

      on('d-ask', () => App.modal({ title: `${x.maker}에 문의`, body: `<textarea class="textarea" rows="7">${esc(`${x.date} 입고분 검수 결과 수량이 다릅니다. 확인 부탁드립니다.\n\n` + x.lines.filter(l => l.real !== l.plan).map(l => `· ${pname(l)}: 명세서 ${fmt(l.doc ?? l.plan)} / 입고 ${fmt(l.real)}`).join('\n'))}</textarea>`, actions: [{ label: '닫기' }, { label: '예시 전송', primary: true, onClick: () => App.toast('문의 내용을 보관했습니다 (시연에서는 보내지 않음)') }] }));
      on('d-fix', () => App.modal({ title: '사유 남기고 3PL에 재확인 요청', body: `<p class="sub-text" style="margin:0 0 10px">본사는 차이 사유를 기록하고 3PL에 다시 확인을 요청합니다. 수량 확정은 3PL 계정에서만 합니다.</p><textarea class="textarea" id="why" rows="4" placeholder="예: 생산처 확인 결과 10개 미출하, 다음 입고에 포함"></textarea>`, actions: [{ label: '취소' }, { label: '요청', primary: true, onClick: (el) => {
        const why = $('#why', el).value.trim(); if (!why) { App.toast('사유를 적어야 요청됩니다'); return false; }
        x.memo = why; x.status = '3PL 검수'; App.refresh(); App.toast('사유를 남기고 3PL에 재확인을 요청했습니다'); } }] }));
      on('d-pay', () => { x.status = '결제 요청'; App.refresh(); App.toast('확정 수량으로 회계에 결제를 요청했습니다'); });
    },
  };

  /* ── 상품 재고: 소비기한별 묶음 ── */
  function lotCard(p) {
    const r = ruleOf(p), L = lotsOf(p.dr);
    return `<div class="card lot-card"><div class="card-head">소비기한별 재고<span class="right sub-text">1차 알림 입고 후 ${r.a1m}개월 · 2차 ${r.a2m}개월 · 출고 정지 남은 ${r.stop}일 (${esc(p.cat)} 예시, 부진재고관리대장 값으로 바꿈)</span></div>
      ${table([
        { label: '소비기한', get: l => l.exp },
        { label: '남은 일수', cls: 'num', get: l => l.remain + '일' },
        ...DATA.warehouses.map(w => ({ label: w.name, cls: 'num', get: l => l[w.key] ? fmt(l[w.key]) : '<span class="muted">-</span>' })),
        { label: '합계', cls: 'num', get: l => `<b>${fmt(DATA.warehouses.reduce((s, w) => s + l[w.key], 0))}</b>` },
        { label: '구분', get: l => esc(l.kind) },
        { label: '쿠팡 입고', get: l => l.remain / r.life >= 0.5 ? '<span class="muted">가능</span>' : st4('쿠팡 불가') },
        { label: '입고 후', cls: 'num', get: l => (l.age / 30.4).toFixed(1) + '개월' },
        { label: '상태', get: l => st4(lotState(p, l)) },
      ], L)}
      <div class="card-body sub-text" style="line-height:1.7;border-top:1px solid var(--line)">출고는 먼저 들어온 묶음부터 하되, 자사몰 → 스마트스토어 → 쿠팡 등 종합몰 순으로 새 묶음을 배정합니다. 반품으로 다시 들어온 묶음이 지금 출고분과 소비기한 ${DATA.returnRule}일 안쪽이면 바로 재고로 편입해 오늘·내일 출고에 먼저 쓰도록 3PL에 요청합니다. 출고 정지일 전에 남은 물량은 반출·기부로 소진합니다. 쿠팡은 남은 소비기한이 절반 미만이면 입고할 수 없습니다. 사료는 품목과 묶음이 많아 처음에는 3PL이 회신한 소비기한을 기록하는 방식으로 시작하고, 알림 기준(입고 후 경과 또는 남은 일수)은 물류 담당자와 정합니다.</div></div>`;
  }
  function expiryPanel() {
    const rows = [];
    DATA.products.forEach(p => lotsOf(p.dr).forEach(l => { const s = lotState(p, l); if (s !== '출고 가능') rows.push({ p, l, s }); }));
    rows.sort((a, b) => a.l.remain - b.l.remain);
    return `<section class="v3-panel" style="padding:16px 20px"><header style="margin-bottom:10px"><h2>소비기한 임박 묶음</h2><span>${rows.length}묶음 · 품목별 출고 정지·알림 기준</span><button class="btn sm" id="rule" style="margin-left:auto">기준 설정</button></header>
      <ol class="watch exp">${rows.slice(0, 6).map(x => `<li><button data-go="inv-product/${x.p.dr}">${esc(x.p.name)} · ${x.l.exp}</button><span class="sub-text" style="text-align:right">${fmt(DATA.warehouses.reduce((s, w) => s + x.l[w.key], 0))}개 · ${x.l.remain}일</span>${st4(x.s)}</li>`).join('')}</ol></section>`;
  }
  function ruleModal() {
    const R = DATA.expiryRule;
    App.modal({ title: '소비기한 기준 (품목군 기본값)', wide: true,
      body: `<p class="sub-text" style="margin:0 0 12px">품목군마다 기본값을 두고 품목별로 바꿀 수 있습니다. 1·2차 알림은 입고 뒤 지난 개월 수, 출고 정지는 남은 소비기한(일)입니다. 날짜는 제조일이 아니라 생산팀이 표시한 소비기한으로 계산합니다.</p>${table([
        { label: '품목군', get: k => k }, { label: '전체 소비기한(일)', cls: 'num', get: k => `<input class="input num sm" data-k="${k}|life" value="${R[k].life}">` },
        { label: '1차 알림(개월)', cls: 'num', get: k => `<input class="input num sm" data-k="${k}|a1m" value="${R[k].a1m}">` },
        { label: '2차 알림(개월)', cls: 'num', get: k => `<input class="input num sm" data-k="${k}|a2m" value="${R[k].a2m}">` },
        { label: '출고 정지(남은 일)', cls: 'num', get: k => `<input class="input num sm" data-k="${k}|stop" value="${R[k].stop}">` }], Object.keys(R))}<div class="form-grid" style="margin-top:12px"><label>반품 재입고</label><div class="row-gap"><span class="sub-text">지금 출고분과 소비기한 차이</span><input class="input num sm" id="rr30" value="${DATA.returnRule}"><span class="sub-text">일 이내면 바로 편입·우선 출고</span></div></div>`,
      actions: [{ label: '취소' }, { label: '저장', primary: true, onClick: (el) => { $$('[data-k]', el).forEach(i => { const [k, f] = i.dataset.k.split('|'); R[k][f] = +i.value || R[k][f]; }); DATA.returnRule = +$('#rr30', el).value || DATA.returnRule; App.refresh(); App.toast('소비기한 기준을 저장했습니다'); } }] });
  }

  /* ── 쿠팡: 자사몰 몫을 남긴 추천, 50% 규칙, 센터별 등록 정보 ── */
  const cp = App.screens['coupang'];
  const OWN_SHARE = 0.55;
  const nextInDays = (p) => { const inc = (DATA.incoming[p.dr] || [])[0]; return inc ? Math.max(1, Math.round((D(inc[0]) - TODAY) / DAY)) : p.lt; };
  function coupangPlan() {
    const used = {}, out = [];
    DATA.coupang.lines.forEach(l => {
      const p = Calc.prod(l.dr), r = ruleOf(p);
      const ok50 = lotsOf(p.dr).filter(x => x.remain / r.life >= 0.5 && lotState(p, x) !== '출고 정지').reduce((s, x) => s + x.tri, 0);
      const own = Math.ceil(Calc.avg(p.dr) * OWN_SHARE * nextInDays(p));
      const free = Math.max(0, ok50 - own - (used[p.dr] || 0));
      const rec = Math.min(l.qty, Math.floor(free / 10) * 10);
      used[p.dr] = (used[p.dr] || 0) + rec;
      out.push({ ok50, own, rec, days: nextInDays(p) });
    });
    return out;
  }
  cp.rec = function (l) { return coupangPlan()[DATA.coupang.lines.indexOf(l)].rec; };
  cp.lineTable = function (edit) {
    const c = DATA.coupang, plan = coupangPlan();
    return table([
      { label: '발주번호', get: l => l.po }, { label: '센터', get: l => l.center }, { label: '상품', get: l => esc(Calc.prod(l.dr).name) },
      { label: '발주 수량', cls: 'num', get: l => fmt(l.qty) }, { label: '입고예정일', get: l => l.eta },
      { label: '쿠팡 가능 재고', cls: 'num', get: (l, i) => `${fmt(plan[i].ok50)}<div class="sub-text">남은 소비기한 50% 이상</div>` },
      { label: '자사몰 몫', cls: 'num', get: (l, i) => `${fmt(plan[i].own)}<div class="sub-text">다음 입고까지 ${plan[i].days}일</div>` },
      { label: '추천 수량', cls: 'num', get: (l, i) => plan[i].rec < l.qty ? `<span class="danger">${fmt(plan[i].rec)}</span>` : fmt(plan[i].rec) },
      ...(edit ? [
        { label: '확정 수량', cls: 'num', get: (l, i) => `<input class="input num sm" data-ok="${i}" value="${l.ok}">` },
        { label: '입고유형', get: (l, i) => `<select class="select sm" data-ty="${i}">${['밀크런', '택배'].map(t => `<option ${t === l.type ? 'selected' : ''}>${t}</option>`).join('')}</select>` },
      ] : []),
    ], c.lines);
  };
  DATA.coupang.ship = {};
  function shipCard() {
    const c = DATA.coupang, centers = [...new Set(c.lines.map(l => l.center))];
    const S = c.ship;
    centers.forEach(ce => { if (!S[ce]) { const ls = c.lines.filter(l => l.center === ce); const q = ls.reduce((s, l) => s + (l.ok || 0), 0); const milk = ls.some(l => l.type === '밀크런'); S[ce] = { milk, pallets: milk ? Math.max(1, Math.ceil(q / 180)) : 0, boxes: Math.max(1, Math.ceil(q / 24)), kg: Math.round(q * 1.9), note: milk ? '상단 적재 금지' : '', reply: milk, inv: '' }; } });
    return `<div class="card ship-card"><div class="card-head">센터별 등록 정보<span class="right sub-text">쿠팡에 건별로 넣던 값을 한 번에 정리합니다</span></div>
      ${table([
        { label: '센터', get: ce => `<b>${ce}</b>` }, { label: '방식', get: ce => S[ce].milk ? '밀크런' : '택배' },
        { label: '팔레트', cls: 'num', get: ce => S[ce].milk ? `<input class="input num sm" data-s="${ce}|pallets" value="${S[ce].pallets}">` : '<span class="muted">-</span>' },
        { label: '박스', cls: 'num', get: ce => `<input class="input num sm" data-s="${ce}|boxes" value="${S[ce].boxes}">` },
        { label: '총 무게(kg)', cls: 'num', get: ce => `<input class="input num sm" data-s="${ce}|kg" value="${S[ce].kg}">` },
        { label: '송장번호 · 주의사항', get: ce => S[ce].milk ? `<input class="input sm" data-s="${ce}|note" value="${esc(S[ce].note)}" placeholder="주의사항">` : `<input class="input sm" data-s="${ce}|inv" value="${esc(S[ce].inv)}" placeholder="박스별 송장번호 (3PL 회신)">` },
        { label: '배차 회신', get: ce => S[ce].milk ? `<input type="checkbox" data-s="${ce}|reply" ${S[ce].reply ? 'checked' : ''}>` : '<span class="muted">-</span>' },
      ], centers)}
      <div class="card-body row-gap" style="border-top:1px solid var(--line)"><span class="sub-text">박스 가로·세로·높이는 상품별 기본값을 쓰고, 다르면 3PL 회신으로 고칩니다.</span><span class="grow"></span><button class="btn" id="cp-work">현장 작업 지시서 내려받기</button><button class="btn" id="cp-bulk">쿠팡 입력용 파일 만들기</button></div></div>`;
  }

  /* ── 3PL 정산: 원본 양식 그대로, 세 창고 합산 ── */
  const V = DATA.billing.vendors;
  V.tri.items = [['일반 작업비 (평일)', 1980, 1980, 1100], ['주말 작업비', 160, 160, 1500], ['박스 작업비', 2140, 2140, 300], ['박스 퀵 출고', 12, 12, 8000], ['팔레트 출고 (쿠팡 밀크런 등)', 24, 22, 15000],
    ['보관료 (팔레트 300개 고정)', 1, 1, 4500000], ['팔레트 이동·상하차', 18, 18, 8000], ['증정품 제작 (특수 작업)', 1, 1, 650000], ['택배비 (박스 규격별)', 2140, 2140, 2450]];
  V.naver.items = [['단수 작업비', 980, 980, 1700], ['단포 작업비', 290, 290, 2100], ['이종합포 작업비', 152, 140, 2600], ['택배비', 1422, 1410, 2900], ['보관료 (CBM)', 64, 64, 22000]];
  V.fresh.items = [['냉동 출고 작업비', 380, 380, 2800], ['드라이아이스', 380, 380, 1200], ['스티로폼 아이스박스 · 라벨 부착', 380, 380, 1100], ['리플렛 동봉', 380, 380, 60], ['합포장', 41, 38, 700], ['냉동 보관료', 12, 12, 85000]];
  V.cj = { name: '본사 발송 택배 (CJ대한통운)', status: '확인 완료', items: [['본사 발송 택배', 120, 120, 3100], ['도서산간 추가', 4, 4, 3000]] };
  V.truck = { name: '화물 운송', status: '확인 중', items: [['11/12 5톤 · 생산처 → 트라이엄프 (사료 18팔레트)', 1, 1, 380000], ['11/19 2.5톤 · 트라이엄프 → 네이버 풀필먼트', 1, 1, 220000]] };
  DATA.billing.shipments = { tri: 2140, naver: 1410, fresh: 380 };
  const CAT = (n) => /보관/.test(n) ? '보관료' : /택배|운임|도서/.test(n) ? '택배비' : /이동|상하차|톤/.test(n) ? '운송' : /작업비|출고|합포|제작/.test(n) ? '작업비' : '부자재';
  function billingSum() {
    const keys = Object.keys(V), cats = ['작업비', '택배비', '보관료', '부자재', '운송'];
    const sum = {}; cats.forEach(c => { sum[c] = {}; keys.forEach(k => { sum[c][k] = 0; }); });
    keys.forEach(k => V[k].items.forEach(([n, bq, rq, pr]) => { sum[CAT(n)][k] += bq * pr; }));
    const ship = Object.values(DATA.billing.shipments).reduce((a, b) => a + b, 0);
    const tot = (c) => keys.reduce((s, k) => s + sum[c][k], 0);
    const all = cats.reduce((s, c) => s + tot(c), 0);
    const sales = DATA.mgmt.totals.sales;
    return `<section class="v3-panel bill-sum"><header style="padding:16px 20px 0"><h2>세 창고와 운송 합산</h2><span>${DATA.billing.month} 청구 · 출고 ${fmt(ship)}건 기준</span><span class="asof">원본 정산서 · PlusCL 송장 완료 · 택배사 청구</span></header>
      ${table([
        { label: '항목', get: c => `<b>${c}</b>` },
        ...keys.map(k => ({ label: V[k].name.replace('본사 발송 택배 (CJ대한통운)', '본사 택배'), cls: 'num', get: c => sum[c][k] ? fmt(sum[c][k]) : '<span class="muted">-</span>' })),
        { label: '합계', cls: 'num', get: c => `<b>${fmt(tot(c))}</b>` },
        { label: '출고 건당', cls: 'num', get: c => c === '운송' ? '<span class="muted">-</span>' : fmt(Math.round(tot(c) / ship)) + '원' },
        { label: '매출 대비', cls: 'num', get: c => (tot(c) / sales * 100).toFixed(2) + '%' },
      ], cats, { foot: `<td>합계</td>${keys.map(k => `<td class="num">${fmt(cats.reduce((s, c) => s + sum[c][k], 0))}</td>`).join('')}<td class="num">${fmt(all)}</td><td class="num">${fmt(Math.round(all / ship))}원</td><td class="num">${(all / sales * 100).toFixed(2)}%</td>` })}

            + foot(false, true, '3PL에 소비기한 확인 요청', '<button class="btn" id="cp-form">현장 확인 양식 내려받기</button>') : '');
      } else if (c.step === 2) {

      on('cp-b', () => go(c.step - 1));
      on('reset', () => { c.step = 1; c.uploaded = false; c.reply = null; c.inv = {}; c.ship = {}; c.lines.forEach(l => { delete l.ok; delete l.type; }); App.refresh(); });
      on('cp-up', () => App.upload({ title: '쿠팡 발주 파일 올리기', slots: [{ key: 'po', label: '쿠팡 발주 파일', sub: '서플라이어 허브 · 기간 지정' }], onDone: () => { c.uploaded = true; App.refresh(); } }));
      on('cp-form', () => App.download(`쿠팡입고목록_소비기한확인_${c.week.slice(0, 5).replace('/', '')}.csv`, [['상품', '발주 합계', '나갈 소비기한(3PL 기입)', '수량(3PL 기입)'], ...byItem().map(x => [Calc.prod(x[0]).name, x[1], '', ''])]));
      if (c.step === 1) on('cp-n', () => go(2));
      on('cp-reply', () => { makeReply(); App.refresh(); App.toast('3PL이 회신한 소비기한을 반영했습니다'); });
      if (c.step === 2) on('cp-n', () => go(3));
      $$('[data-ok]', root).forEach(i => i.onchange = () => { c.lines[+i.dataset.ok].ok = +i.value || 0; });
      $$('[data-ty]', root).forEach(s => s.onchange = () => { c.lines[+s.dataset.ty].type = s.value; });
      if (c.step === 3) on('cp-n', () => { const plan = coupangPlan(); c.lines.forEach((l, i) => { if (l.ok === undefined) l.ok = plan[i].rec; if (!l.type) l.type = l.qty >= 200 ? '밀크런' : '쉽먼트'; }); c.ship = {}; go(4); });
      $$('[data-s]', root).forEach(inp => inp.onchange = () => { const [ce, f] = inp.dataset.s.split('|'); c.ship[ce][f] = inp.type === 'checkbox' ? inp.checked : inp.classList.contains('num') ? +inp.value || 0 : inp.value; });
      on('cp-paste', () => App.download('쿠팡_입력용_센터별.csv', [['센터', '방식', '박스', '가로×세로×높이', '팔레트', '중량', '상품 종류', '팔레트 종류', '취급주의', '배차 회신', '박스 분할', '택배사', '발송일'], ...centers().map(ce => { const S = c.ship[ce]; return [ce, S.milk ? '밀크런' : '쉽먼트', S.boxes, S.size, S.pallets, S.kg, S.kinds, S.ptype, S.care, S.reply ? '예' : '아니오', S.split, S.carrier, S.send]; })]));
      if (c.step === 4) on('cp-n', () => go(5));
      on('cp-work', () => App.download('쿠팡_3PL_작업지시서.csv', [['센터', '방식', '위치', '상품', '수량', '보낼 소비기한'], ...c.lines.filter(l => l.ok).map((l, i) => [l.center, c.ship[l.center].milk ? '밀크런' : '쉽먼트', c.ship[l.center].milk ? `${1 + (i % 2)}번 팔레트` : `${1 + (i % 3)}번 박스`, Calc.prod(l.dr).name, l.ok, c.reply && c.reply[l.dr] ? c.reply[l.dr].exp : ''])]));
      on('cp-inv', () => { centers().filter(ce => !c.ship[ce].milk).forEach((ce, k) => { c.inv[ce] = `56123${(8800 + k * 7).toString()}0${k}`; }); App.refresh(); App.toast('3PL 송장 회신을 반영했습니다. 쿠팡 송장 입력 표를 내려받을 수 있습니다'); });
      if (c.step === 5) on('cp-n', () => go(6));
      if (c.step === 6) on('cp-n', () => { c.lines.forEach(l => { if (l.ok) Calc.prod(l.dr).stock.tri -= l.ok; }); c.monthTotal += c.lines.reduce((s, l) => s + (l.ok || 0), 0) * 12000; go(7); App.toast('3PL 출고 확정, 재고에서 뺐습니다'); });
    },
  };

  /* 제안서 화면 캡처용: ?cp=3 처럼 주면 그 단계에서 시작 */
  const cpStart = +new URLSearchParams(location.search).get('cp');
  if (cpStart >= 2) {
    c.uploaded = true; c.step = cpStart;
    if (cpStart >= 3) makeReply();
    if (cpStart >= 4) { const plan = coupangPlan(); c.lines.forEach((l, i) => { l.ok = plan[i].rec; l.type = l.qty >= 200 ? '밀크런' : '쉽먼트'; }); }
  }

  /* ── 상품 재고: 창고 골라 보기, 네이버 풀필먼트 보충 ── */
  UI.whSel = UI.whSel || { tri: true, naver: true, fresh: true };
  function naverRefill() {
    const rows = DATA.products.filter(p => p.stock.naver > 0).map(p => {
      const share = p.stock.naver / Math.max(1, Calc.total(p)); const day = Calc.avg(p.dr) * share;
      const need = (d) => Math.round(day * d);
      const send = Math.max(0, Math.ceil((need(40) - p.stock.naver) / 10) * 10);
      return { p, day, need20: need(20), need40: need(40), need60: need(60), send };
    }).sort((a, b) => b.send - a.send).slice(0, 6);
    return `<section class="v3-panel" style="padding:16px 20px"><header style="margin-bottom:8px"><h2>네이버 풀필먼트 보충</h2><span>네이버 판매량으로 20·40·60일치를 보고 트라이엄프에서 옮길 수량</span></header>
      ${table([{ label: '상품', get: x => esc(x.p.name) }, { label: '네이버 하루 판매', cls: 'num', get: x => x.day.toFixed(1) }, { label: '네이버 재고', cls: 'num', get: x => fmt(x.p.stock.naver) },
        { label: '20일치', cls: 'num', get: x => fmt(x.need20) }, { label: '40일치', cls: 'num', get: x => fmt(x.need40) }, { label: '60일치', cls: 'num', get: x => fmt(x.need60) },
        { label: '옮길 수량 (40일 기준)', cls: 'num', get: x => x.send ? `<b>${fmt(x.send)}</b>` : '<span class="muted">0</span>' }], rows)}
      <p class="sub-text" style="margin:8px 0 0;line-height:1.6">옮긴 수량은 판매가 아니라 창고 이동으로 기록하고, 월 사료 발주 계산에서 뺍니다. 거의 안 팔리는 1kg 사료 2종은 트라이엄프에서 바로 출고합니다.</p></section>`;
  }
  function whFilter(main) {
    const f = main.querySelector('.filters'); if (!f || f.querySelector('.whsel')) return;
    f.insertAdjacentHTML('beforeend', `<span class="whsel sub-text">창고 ${DATA.warehouses.map(w => `<label class="row-gap" style="display:inline-flex;margin-left:8px"><input type="checkbox" data-wh="${w.key}" ${UI.whSel[w.key] ? 'checked' : ''}>${w.name}</label>`).join('')}</span>`);
    $$('[data-wh]', f).forEach(cb => cb.onchange = () => { UI.whSel[cb.dataset.wh] = cb.checked; App.refresh(); });
    const t = main.querySelector('.table-wrap table'); if (!t) return;
    const heads = Array.from(t.querySelectorAll('thead th')).map(th => th.textContent.trim());
    DATA.warehouses.forEach(w => { if (UI.whSel[w.key]) return; const i = heads.indexOf(w.name); if (i < 0) return; t.querySelectorAll('tr').forEach(tr => { if (tr.cells[i]) tr.cells[i].style.display = 'none'; }); });
    const it = heads.indexOf('총재고');
    if (it >= 0 && !DATA.warehouses.every(w => UI.whSel[w.key])) t.querySelectorAll('tbody tr[data-go]').forEach(tr => { const p = Calc.prod(tr.dataset.go.split('/')[1]); const b = tr.cells[it] && tr.cells[it].querySelector('b'); if (p && b) b.textContent = fmt(DATA.warehouses.filter(w => UI.whSel[w.key]).reduce((s, w) => s + p.stock[w.key], 0)); });
  }

  /* ── 입고 예정 캘린더 ── */
  function inboundCal() {
    const up = DATA.inbound.filter(x => (x.status === '예정 등록' || x.status === '3PL 검수') && (!UI.inb || UI.inb.brand === '전체' || x.brand === UI.inb.brand)).slice().sort((a, b) => a.date.localeCompare(b.date));
    return `<section class="v3-panel" style="padding:16px 20px"><header style="margin-bottom:8px"><h2>입고 예정 캘린더</h2><span>사료 주 1~2회, 용품은 수시 · 쿠팡 입고 가능 수량과 발주 계산이 이 날짜를 씁니다</span></header>
      <div class="cal">${up.map(x => `<button class="cal-day" data-go="inbound/${x.id}"><em>${x.date}</em><b>${esc(x.lines[0].name || Calc.prod(x.lines[0].dr).name)}${x.lines.length > 1 ? ` 외 ${x.lines.length - 1}` : ''}</b><span>${esc(x.brand || '닥터독')} · ${fmt(x.lines.reduce((s, l) => s + l.plan, 0))}개 · ${esc(x.maker)}</span></button>`).join('')}</div></section>`;
  }

  /* ── 상품 마스터에 더할 항목 ── */
  function masterCard() {
    const rows = [['Dr001', '사료', '팔레트 단위 대조', '180일', 'PlusCL 트라이엄프 · 닥터독', '네이버 풀필먼트', '60×40×35cm · 8입'], ['Dr006', '사료', '팔레트 단위 대조', '180일', 'PlusCL 트라이엄프 · 닥터독', '트라이엄프 (1kg 예외)', '45×30×30cm · 10입'], ['Dr030', '간식', '무게 + 표본 1박스', '120일', 'PlusCL 트라이엄프 · 닥터독', '네이버 풀필먼트', '50×35×30cm · 100입']];
    return `<div class="card master-card"><div class="card-head">상품 마스터에 더할 항목<span class="right sub-text">경영진은 상품명으로, 실무자는 코드 연결까지 봅니다</span></div>
      ${table([{ label: '기준코드', get: r => r[0] }, { label: '품목군', get: r => r[1] }, { label: '입고 검수 방식', get: r => r[2] }, { label: '출고 정지일', get: r => r[3] }, { label: '브랜드 · 출고 전산창고', get: r => r[4] }, { label: '스마트스토어 출고 창고', get: r => r[5] }, { label: '규격 · 입수', get: r => r[6] }], rows)}
      <div class="card-body sub-text" style="line-height:1.7;border-top:1px solid var(--line)">기준코드는 물류팀이 쓰는 일현코퍼레이션 공통 코드로 바꾸고, 그 아래에 PlusCL·네이버 코드를 연결합니다. 한 창고를 여러 브랜드가 쓰므로 상품마다 브랜드와 출고 전산창고를 정해 출고량과 정산이 회사별로 잡히게 합니다. 규격(가로·세로·높이, 입수)을 넣어 두면 쿠팡 일괄 등록 파일을 만들 때 다시 쓰입니다.</div></div>`;
  }

  /* ── 11/24 물류 회의: 출고 구분(B2C·B2B·기타), 가용·보류, 출고 방식 ── */
  const B2B_SHARE = [0.22, 0.12, 0.3, 0.08, 0.18, 0.15];          // 예시 비율
  function outSplit() {
    const rows = DATA.products.slice(0, 8).map((p, i) => {
      const o = Calc.out(p.dr); const tot = o ? o.d1 : 0; const ex = o ? Calc.exSum(o.ex) : 0;
      const b2b = Math.round((tot - ex) * B2B_SHARE[i % B2B_SHARE.length]);
      return { p, b2c: tot - ex - b2b, b2b, etc: ex, tot };
    });
    return `<div class="card"><div class="card-head">출고 구분 · 최근 1개월<span class="right sub-text">수불은 상품별 합계로, B2C·B2B·그 밖의 출고를 나눠 봅니다 (예시)</span></div>
      ${table([
        { label: '상품', get: r => esc(r.p.name) },
        { label: 'B2C (판매처 주문)', cls: 'num', get: r => fmt(r.b2c) },
        { label: 'B2B (대리점·도매)', cls: 'num', get: r => fmt(r.b2b) },
        { label: '그 밖의 출고', cls: 'num', get: r => fmt(r.etc) },
        { label: '합계', cls: 'num', get: r => `<b>${fmt(r.tot)}</b>` },
      ], rows)}
      <div class="card-body sub-text" style="line-height:1.7;border-top:1px solid var(--line)">그 밖의 출고는 행사·협찬·반품 출고·창고 이동·기부·개봉·폐기·마케팅 사용이며, 발주 계산에서는 빼고 봅니다. 출고 사유는 PlusCL에서 쓰는 사유와 같은 목록으로 맞춥니다.</div></div>`;
  }
  function availHold() {
    const rows = DATA.products.slice(0, 8).map((p, i) => {
      const st = Object.values(p.stock || {}).reduce((a, b) => a + (+b || 0), 0);
      const hold = Math.round(st * [0.02, 0.0, 0.05, 0.01, 0.03, 0.0][i % 6]);
      return { p, st, hold, avail: st - hold };
    });
    return `<section class="v3-panel" style="padding:16px 20px"><header style="margin-bottom:8px"><h2>가용 · 보류</h2><span>보류는 반품 검수 대기·불량 확인·출고 보류 물량 (예시)</span></header>
      ${table([
        { label: '상품', get: r => esc(r.p.name) },
        { label: '전산 재고', cls: 'num', get: r => fmt(r.st) },
        { label: '보류', cls: 'num', get: r => r.hold ? `<span class="danger">${fmt(r.hold)}</span>` : '<span class="muted">0</span>' },
        { label: '가용', cls: 'num', get: r => `<b>${fmt(r.avail)}</b>` },
      ], rows)}</section>`;
  }
  function shipMethods() {
    return `<section class="v3-panel" style="padding:16px 20px"><header style="margin-bottom:8px"><h2>출고 방식</h2><span>주문마다 하나를 고릅니다</span></header>
      <ul class="rule-list"><li><b>택배</b> · WMS에 등록하면 송장이 자동으로 발권되고, 송장 번호를 판매처에 회신합니다.</li>
      <li><b>자체 배송 (퀵·차량)</b> · 대량·급한 건은 송장 없이 배차 정보와 인수 확인으로 출고를 확정합니다.</li>
      <li><b>쿠팡 밀크런·쉽먼트</b> · 쿠팡 로켓 화면의 입력 자료와 작업 지시서로 나갑니다.</li></ul></section>`;
  }

  /* ── 그린 뒤에 얹기 ── */
  const mainBefore = App.renderMain.bind(App);
  App.renderMain = function () {
    mainBefore();
    const main = document.getElementById('main'); if (!main) return;
    const { id, param } = this.current;
    try {
      if (id === 'inv-product' && !param) {
        whFilter(main);
        const panels = main.querySelectorAll('.v3-panel'); const last = panels[panels.length - 1];
        if (last) last.insertAdjacentHTML('afterend', naverRefill());
      }
      if (id === 'outbound' && !param) { const cards = main.querySelectorAll('.card'); const lastc = cards[cards.length - 1]; if (lastc) lastc.insertAdjacentHTML('afterend', outSplit()); }
      if (id === 'inv-product' && !param) { const ps = main.querySelectorAll('.v3-panel'); const lp = ps[ps.length - 1]; if (lp) lp.insertAdjacentHTML('afterend', availHold()); }
      if (id === 'inbound' && !param) { const fb = main.querySelector('.flowbar'); if (fb) fb.insertAdjacentHTML('afterend', inboundCal()); }
      if (id === 'products' && !param) { const card = main.querySelector('.card .table-wrap'); if (card) card.closest('.card').insertAdjacentHTML('beforebegin', masterCard()); }
      if (id === 'orders' && !param) {
        { const cards = main.querySelectorAll('.card'); const lastc = cards[cards.length - 1]; if (lastc && !main.querySelector('#ship-methods')) lastc.insertAdjacentHTML('afterend', shipMethods().replace('<section ', '<section id="ship-methods" ')); }
        const acts = main.querySelector('.page-head .actions');
        if (acts && !acts.querySelector('#pick')) { acts.insertAdjacentHTML('afterbegin', '<button class="btn" id="pick">피킹리스트</button>'); acts.querySelector('#pick').onclick = () => { const m = {}; DATA.orders.filter(o => o.status !== '출고완료').forEach(o => { m[o.item] = (m[o.item] || 0) + o.qty; }); App.download('피킹리스트_상품별합계.csv', [['상품', '수량'], ...Object.entries(m)]); }; }
      }
      main.querySelectorAll('span.st-need, span.st-doing, span.st-done').forEach(s => { if (!s.closest('.filters')) s.classList.add('pill'); });
    } catch (err) { console.error('v5 layer', err); }
  };
}

App.start();
</script></body></html>
